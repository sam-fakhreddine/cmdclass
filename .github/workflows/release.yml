name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The proof needs a current runtime: it relies on the permission model covering sockets and on
          # the spec reporter for piped test output. The minimum supported runtime stays in package.json.
          node-version: "26.13.1"

      - name: Verify release tag
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const expectedTag = `v${version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Expected tag ${expectedTag}, got ${process.env.RELEASE_TAG}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The proof installs the packed tarball with --offline, which needs each runtime dependency's
      # registry metadata in the npm cache. `npm ci` caches the tarballs only.
      - name: Cache runtime dependency metadata
        run: |
          node -p 'Object.entries(require("./package.json").dependencies).map(([name, version]) => name + "@" + version).join(" ")' | xargs npm cache add

      - name: Run release proof
        run: npm run test:proof

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm pack --ignore-scripts
          gh release create "$RELEASE_TAG" "cmdclass-${PACKAGE_VERSION}.tgz" --verify-tag --generate-notes
